security:
    password_hashers:
        App\Security\Account: auto
    providers:
        accounts:
            id: App\Security\AccountProvider
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: accounts
            custom_authenticator: App\Security\LoginAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
                invalidate_session: true
    access_control:
        - { path: ^/admin/dang-nhap$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/(trang-chu|tai-khoan|gio-hang|danh-muc)(/|$), roles: ROLE_USER }
