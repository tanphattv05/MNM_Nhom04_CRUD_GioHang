doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Empty credentials make PDO_SQLSRV use Windows Authentication.
        # Credentials present in DATABASE_URL override these values.
        user: ''
        password: ''

        # Local SQL Server uses its self-signed certificate. Keep this setting
        # out of production unless the server certificate is trusted there.
        options:
            Driver: '{ODBC Driver 18 for SQL Server}'
            Encrypt: '1'
            TrustServerCertificate: '1'

        logging: false
        profiling: false
        profiling_collect_backtrace: false
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
